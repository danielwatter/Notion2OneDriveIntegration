[project]
name = "ha-notion-backup"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["aiohttp>=3.11"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
