name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        homeassistant: ['2026.10.4', '2026.11.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install homeassistant==${{ matrix.homeassistant }}
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: sh -n scripts/install.sh
